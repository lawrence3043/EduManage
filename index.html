<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduManage - Students</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 230px;
            height: 100vh;

            background-color: #172b4d;
            color: white;

            padding: 25px 15px;
        }


        .logo {
            font-size: 24px;
            font-weight: bold;
            text-align: center;

            margin-bottom: 40px;
        }


        .menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }


        .menu li {
            margin-bottom: 10px;
        }


        .menu a {
            display: block;

            padding: 13px 15px;

            color: white;
            text-decoration: none;

            border-radius: 6px;
        }


        .menu a:hover {
            background-color: #244a7c;
        }


        .menu .active {
            background-color: #1976d2;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .main {
            margin-left: 230px;
            min-height: 100vh;
        }


        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 70px;

            background-color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            border-bottom: 1px solid #ddd;
        }


        .topbar h2 {
            margin: 0;
            color: #333;
        }


        .admin {
            color: #555;
            font-weight: bold;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            padding: 30px;
        }


        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }


        .page-header h1 {
            margin: 0;
        }


        .page-header p {
            color: #666;
            margin-top: 8px;
        }


        /* =========================
           ADD BUTTON
        ========================= */

        .add-button {
            background-color: #1976d2;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 12px 18px;

            cursor: pointer;
            font-size: 14px;
        }


        .add-button:hover {
            background-color: #125ca1;
        }


        /* =========================
           FORM
        ========================= */

        .student-form {
            background-color: white;

            padding: 25px;

            border-radius: 8px;

            margin-bottom: 25px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .student-form h3 {
            margin-top: 0;
        }


        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }


        .student-form input {
            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 5px;
        }


        .form-buttons {
            margin-top: 15px;
        }


        .form-buttons button {
            padding: 10px 18px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            margin-right: 8px;
        }


        .save-button {
            background-color: #1976d2;
            color: white;
        }


        .cancel-button {
            background-color: #777;
            color: white;
        }


        /* =========================
           TABLE SECTION
        ========================= */

        .table-section {
            background-color: white;

            padding: 25px;

            border-radius: 8px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .table-section h2 {
            margin-top: 0;
        }


        table {
            width: 100%;

            border-collapse: collapse;
        }


        th,
        td {
            padding: 13px;

            border-bottom: 1px solid #eee;

            text-align: left;
        }


        th {
            background-color: #f5f5f5;
            color: #555;
        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        .edit-button {
            padding: 7px 12px;

            border: none;

            border-radius: 4px;

            background-color: #1976d2;

            color: white;

            cursor: pointer;

            margin-right: 5px;
        }


        .delete-button {
            padding: 7px 12px;

            border: none;

            border-radius: 4px;

            background-color: #d32f2f;

            color: white;

            cursor: pointer;
        }


        .edit-button:hover {
            background-color: #125ca1;
        }


        .delete-button:hover {
            background-color: #b71c1c;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="logo">
            🎓 EduManage
        </div>


        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    🏠 Dashboard
                </a>
            </li>


            <li>
                <a href="index.html" class="active">
                    👨‍🎓 Students
                </a>
            </li>


            <li>
                <a href="courses.html">
                    📚 Courses
                </a>
            </li>


            <li>
                <a href="#">
                    📊 Grades
                </a>
            </li>


            <li>
                <a href="#">
                    👥 Users
                </a>
            </li>


            <li>
                <a href="#">
                    ⚙ Settings
                </a>
            </li>


            <li>
                <a href="#">
                    🚪 Logout
                </a>
            </li>

        </ul>

    </aside>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <h2>
                Student Management
            </h2>


            <div class="admin">
                Admin ▼
            </div>

        </header>



        <!-- CONTENT -->

        <section class="content">


            <!-- PAGE HEADER -->

            <div class="page-header">

                <div>

                    <h1>
                        Students
                    </h1>

                    <p>
                        View and manage all students.
                    </p>

                </div>


                <button
                    class="add-button"
                    onclick="showAddForm()"
                >
                    + Add New Student
                </button>

            </div>



            <!-- =========================
                 ADD STUDENT FORM
            ========================= -->

            <div
                class="student-form"
                id="addStudentSection"
                style="display: none;"
            >

                <h3>
                    Add New Student
                </h3>


                <form id="studentForm">


                    <div class="form-grid">


                        <input
                            type="number"
                            id="user_id"
                            placeholder="User ID"
                            required
                        >


                        <input
                            type="number"
                            id="department_id"
                            placeholder="Department ID"
                            required
                        >


                        <input
                            type="text"
                            id="first_name"
                            placeholder="First Name"
                            required
                        >


                        <input
                            type="text"
                            id="last_name"
                            placeholder="Last Name"
                            required
                        >


                        <input
                            type="email"
                            id="email"
                            placeholder="Email"
                            required
                        >


                        <input
                            type="text"
                            id="phone"
                            placeholder="Phone"
                        >


                        <input
                            type="date"
                            id="date_of_birth"
                            required
                        >

                    </div>


                    <div class="form-buttons">

                        <button
                            type="submit"
                            class="save-button"
                        >
                            Add Student
                        </button>


                        <button
                            type="button"
                            class="cancel-button"
                            onclick="hideAddForm()"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>



            <!-- =========================
                 EDIT STUDENT FORM
            ========================= -->

            <div
                class="student-form"
                id="editStudentSection"
                style="display: none;"
            >

                <h3>
                    Edit Student
                </h3>


                <form id="editStudentForm">


                    <input
                        type="hidden"
                        id="edit_student_id"
                    >


                    <div class="form-grid">


                        <input
                            type="number"
                            id="edit_department_id"
                            placeholder="Department ID"
                            required
                        >


                        <input
                            type="text"
                            id="edit_first_name"
                            placeholder="First Name"
                            required
                        >


                        <input
                            type="text"
                            id="edit_last_name"
                            placeholder="Last Name"
                            required
                        >


                        <input
                            type="email"
                            id="edit_email"
                            placeholder="Email"
                            required
                        >


                        <input
                            type="text"
                            id="edit_phone"
                            placeholder="Phone"
                        >


                        <input
                            type="date"
                            id="edit_date_of_birth"
                            required
                        >

                    </div>


                    <div class="form-buttons">

                        <button
                            type="submit"
                            class="save-button"
                        >
                            Update Student
                        </button>


                        <button
                            type="button"
                            class="cancel-button"
                            onclick="cancelEdit()"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>



            <!-- =========================
                 STUDENT TABLE
            ========================= -->

            <div class="table-section">

                <h2>
                    All Students
                </h2>


                <table>


                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Date of Birth
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="studentTable">

                    </tbody>


                </table>

            </div>


        </section>

    </main>



    <script>


        // ==========================================
        // LOAD STUDENTS
        // ==========================================

        function loadStudents() {


            fetch(
                "http://127.0.0.1:5000/students"
            )


            .then(response => response.json())


            .then(students => {


                const table =
                    document.getElementById(
                        "studentTable"
                    );


                table.innerHTML = "";


                students.forEach(student => {


                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${student.student_id}
                        </td>

                        <td>
                            ${student.first_name}
                            ${student.last_name}
                        </td>

                        <td>
                            ${student.email}
                        </td>

                        <td>
                            ${student.phone}
                        </td>

                        <td>
                            ${student.date_of_birth}
                        </td>

                        <td>

                            <button
                                class="edit-button"
                                onclick='editStudent(${JSON.stringify(student)})'
                            >
                                Edit
                            </button>


                            <button
                                class="delete-button"
                                onclick="deleteStudent(${student.student_id})"
                            >
                                Delete
                            </button>

                        </td>

                    `;


                    table.appendChild(row);

                });

            })


            .catch(error => {

                console.error(
                    "Error:",
                    error
                );

            });

        }



        // ==========================================
        // SHOW ADD FORM
        // ==========================================

        function showAddForm() {

            document
                .getElementById(
                    "addStudentSection"
                )
                .style.display = "block";

        }



        // ==========================================
        // HIDE ADD FORM
        // ==========================================

        function hideAddForm() {

            document
                .getElementById(
                    "addStudentSection"
                )
                .style.display = "none";

        }



        // ==========================================
        // ADD STUDENT
        // ==========================================

        document
            .getElementById("studentForm")
            .addEventListener(
                "submit",
                function(event) {


                    event.preventDefault();


                    const student = {


                        user_id:
                            document
                                .getElementById(
                                    "user_id"
                                )
                                .value,


                        department_id:
                            document
                                .getElementById(
                                    "department_id"
                                )
                                .value,


                        first_name:
                            document
                                .getElementById(
                                    "first_name"
                                )
                                .value,


                        last_name:
                            document
                                .getElementById(
                                    "last_name"
                                )
                                .value,


                        email:
                            document
                                .getElementById(
                                    "email"
                                )
                                .value,


                        phone:
                            document
                                .getElementById(
                                    "phone"
                                )
                                .value,


                        date_of_birth:
                            document
                                .getElementById(
                                    "date_of_birth"
                                )
                                .value

                    };


                    fetch(
                        "http://127.0.0.1:5000/students",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(student)

                        }
                    )


                    .then(response =>
                        response.json()
                    )


                    .then(data => {


                        alert(data.message);


                        document
                            .getElementById(
                                "studentForm"
                            )
                            .reset();


                        hideAddForm();


                        loadStudents();

                    })


                    .catch(error => {

                        console.error(
                            "Error:",
                            error
                        );


                        alert(
                            "Failed to add student."
                        );

                    });

                }
            );



        // ==========================================
        // EDIT STUDENT
        // ==========================================

        function editStudent(student) {


            document
                .getElementById(
                    "editStudentSection"
                )
                .style.display = "block";


            document
                .getElementById(
                    "edit_student_id"
                )
                .value =
                    student.student_id;


            document
                .getElementById(
                    "edit_department_id"
                )
                .value = 1;


            document
                .getElementById(
                    "edit_first_name"
                )
                .value =
                    student.first_name;


            document
                .getElementById(
                    "edit_last_name"
                )
                .value =
                    student.last_name;


            document
                .getElementById(
                    "edit_email"
                )
                .value =
                    student.email;


            document
                .getElementById(
                    "edit_phone"
                )
                .value =
                    student.phone;


            let date =
                new Date(
                    student.date_of_birth
                );


            let year =
                date.getFullYear();


            let month =
                String(
                    date.getMonth() + 1
                )
                .padStart(2, "0");


            let day =
                String(
                    date.getDate()
                )
                .padStart(2, "0");


            document
                .getElementById(
                    "edit_date_of_birth"
                )
                .value =
                    `${year}-${month}-${day}`;


            document
                .getElementById(
                    "editStudentSection"
                )
                .scrollIntoView({
                    behavior: "smooth"
                });

        }



        // ==========================================
        // UPDATE STUDENT
        // ==========================================

        document
            .getElementById(
                "editStudentForm"
            )
            .addEventListener(
                "submit",
                function(event) {


                    event.preventDefault();


                    const studentId =
                        document
                            .getElementById(
                                "edit_student_id"
                            )
                            .value;


                    const updatedStudent = {


                        department_id:
                            document
                                .getElementById(
                                    "edit_department_id"
                                )
                                .value,


                        first_name:
                            document
                                .getElementById(
                                    "edit_first_name"
                                )
                                .value,


                        last_name:
                            document
                                .getElementById(
                                    "edit_last_name"
                                )
                                .value,


                        email:
                            document
                                .getElementById(
                                    "edit_email"
                                )
                                .value,


                        phone:
                            document
                                .getElementById(
                                    "edit_phone"
                                )
                                .value,


                        date_of_birth:
                            document
                                .getElementById(
                                    "edit_date_of_birth"
                                )
                                .value

                    };


                    fetch(
                        `http://127.0.0.1:5000/students/${studentId}`,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    updatedStudent
                                )

                        }
                    )


                    .then(response =>
                        response.json()
                    )


                    .then(data => {


                        alert(data.message);


                        document
                            .getElementById(
                                "editStudentForm"
                            )
                            .reset();


                        document
                            .getElementById(
                                "editStudentSection"
                            )
                            .style.display =
                                "none";


                        loadStudents();

                    })


                    .catch(error => {

                        console.error(
                            "Error:",
                            error
                        );


                        alert(
                            "Failed to update student."
                        );

                    });

                }
            );



        // ==========================================
        // CANCEL EDIT
        // ==========================================

        function cancelEdit() {

            document
                .getElementById(
                    "editStudentForm"
                )
                .reset();


            document
                .getElementById(
                    "editStudentSection"
                )
                .style.display =
                    "none";

        }



        // ==========================================
        // DELETE STUDENT
        // ==========================================

        function deleteStudent(studentId) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this student?"
                );


            if (!confirmDelete) {

                return;

            }


            fetch(
                `http://127.0.0.1:5000/students/${studentId}`,
                {

                    method: "DELETE"

                }
            )


            .then(response =>
                response.json()
            )


            .then(data => {


                alert(data.message);


                loadStudents();

            })


            .catch(error => {

                console.error(
                    "Error:",
                    error
                );


                alert(
                    "Failed to delete student."
                );

            });

        }



        // ==========================================
        // LOAD STUDENTS WHEN PAGE OPENS
        // ==========================================

        loadStudents();

    </script>


</body>

</html>
